# Copy to config.yml (gitignored) and edit. Nothing in this file is secret;
# credentials are read from the macOS Keychain or environment variables.

timezone: America/New_York
output_dir: output

# Page size is in inches. These values match the reMarkable Paper Pro in portrait.
page:
  width_in: 7.07
  height_in: 9.43
  margin_pt: 30
  body_pt: 10

weather:
  location_name: Providence, RI
  latitude: 41.824
  longitude: -71.413

# iCloud mail since midnight. Credentials are NOT stored here: create an app-specific
# password at account.apple.com, then store it with
#   security add-generic-password -s circadex-news -a ICLOUD_USER -w <apple id email>
#   security add-generic-password -s circadex-news -a ICLOUD_PASSWORD -w <app-specific password>
# (or set CIRCADEX_ICLOUD_USER / CIRCADEX_ICLOUD_PASSWORD). Mail is never marked as read.
mail:
  enabled: false
  max_messages: 60
  # Mail from these senders is always shown, even if it looks promotional.
  priority_senders:
    - steampowered.com
  # Optional overrides (regex fragments matched against the subject):
  # alert_keywords: ["bill", "payment due", "security alert"]
  # promo_keywords: ["% off", "sale", "coupon"]

# Yesterday's traffic from Cloudflare Web Analytics. Create an API token (My Profile ->
# API Tokens) with Account > Account Analytics > Read and Account > Account Settings > Read,
# then store it and your account ID with
#   security add-generic-password -s circadex-news -a CLOUDFLARE_TOKEN -w
#   security add-generic-password -s circadex-news -a CLOUDFLARE_ACCOUNT_ID -w
# (or CIRCADEX_CLOUDFLARE_TOKEN / CIRCADEX_CLOUDFLARE_ACCOUNT_ID). All Web Analytics sites in
# the account are included unless you list some here (then the Settings permission is not needed).
analytics:
  enabled: false
  # sites:
  #   - { name: example.com, tag: 0123456789abcdef0123456789abcdef }

# Daily strips, fetched once a day for personal reading. GoComics pages are read for the
# strip image; if the site starts refusing requests, comics are simply left out of that day's
# paper. Images that are not JPEG/PNG are converted with `sips` (built into macOS).
comics:
  enabled: false
  strips:
    - { name: Peanuts, slug: peanuts }
    - { name: Calvin and Hobbes, slug: calvinandhobbes }
    - { name: Garfield, slug: garfield }

# The Guardian's free Quick crossword, drawn as a grid with clues for pen solving.
crossword:
  enabled: false
  # number: 17101   # use a specific puzzle instead of the latest one

news:
  max_age_hours: 36
  max_paragraphs: 14
  sections:
    - title: World
      full_articles: 3
      brief_count: 6
      feeds:
        - { name: NPR, url: "https://feeds.npr.org/1004/rss.xml" }
        - { name: BBC News, url: "https://feeds.bbci.co.uk/news/world/rss.xml" }
        - { name: PBS NewsHour, url: "https://www.pbs.org/newshour/feeds/rss/world" }
    - title: United States
      full_articles: 3
      brief_count: 6
      feeds:
        - { name: NPR, url: "https://feeds.npr.org/1003/rss.xml" }
        - { name: PBS NewsHour, url: "https://www.pbs.org/newshour/feeds/rss/nation" }
    - title: Technology
      full_articles: 2
      brief_count: 6
      feeds:
        - { name: Ars Technica, url: "https://feeds.arstechnica.com/arstechnica/index" }
        - { name: The Verge, url: "https://www.theverge.com/rss/index.xml" }
    - title: Providence & Rhode Island
      full_articles: 3
      brief_count: 6
      feeds:
        - { name: Rhode Island Current, url: "https://rhodeislandcurrent.com/feed/" }
